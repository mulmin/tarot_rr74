<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타로 카드 도감</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --bg:#f6f1e7; --text:#2b2620; --dim:#9a9183; --accent:#9c7b35; --line:rgba(0,0,0,0.1); }
  html, body { min-height:100%; background:var(--bg); color:var(--text); font-family:'Nanum Myeongjo',serif; }

  .page { display:flex; flex-direction:column; align-items:center; padding:28px 16px 48px; min-height:100vh; }
  .back-link {
    align-self:flex-start; font-size:17px; color:var(--dim);
    background:none; border:none; font-family:inherit;
    padding:10px 14px; margin:-8px 0 2px -6px; cursor:pointer; text-decoration:none;
  }
  h1 { font-size:15px; font-weight:400; color:var(--dim); letter-spacing:6px; margin-bottom:8px; }
  .card-title { font-size:26px; font-weight:800; margin-bottom:2px; }
  .card-title-en { font-size:14px; color:var(--accent); letter-spacing:3px; margin-bottom:18px; }

  /* 카드 선택 스트립 */
  .picker {
    width:100%; max-width:430px;
    display:flex; gap:8px;
    overflow-x:auto; padding:4px 2px 12px;
    -webkit-overflow-scrolling:touch;
  }
  .pick-thumb {
    flex:none; width:52px; height:87px;
    border-radius:6px; overflow:hidden;
    border:2px solid transparent;
    opacity:0.45; cursor:pointer;
    position:relative;
  }
  .pick-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .pick-thumb.ready { opacity:1; }
  .pick-thumb.active { border-color:var(--accent); box-shadow:0 0 10px rgba(156,123,53,0.4); }
  .pick-thumb .soon {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(246,241,231,0.55);
    font-size:10px; color:var(--dim);
  }

  /* 카드 + 오버레이 */
  .card-wrap {
    position:relative;
    width:min(88vw, 380px);
    border-radius:12px; overflow:hidden;
    box-shadow:0 14px 44px rgba(60,45,20,0.22);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    margin-bottom:4px;
  }
  .card-img { display:block; width:100%; height:auto; pointer-events:none; }
  .overlay-svg { position:absolute; inset:0; width:100%; height:100%; }

  #dimmer { fill:rgba(246,241,231,0.85); opacity:0; transition:opacity 0.45s ease; pointer-events:none; }
  .has-active #dimmer { opacity:1; }

  .region {
    fill:rgba(255,255,255,0.01);
    stroke:rgba(45,35,20,0.55); stroke-width:0.45;
    cursor:pointer;
    transition:stroke 0.3s, fill 0.3s, stroke-width 0.3s;
    animation:region-breathe 3s ease-in-out infinite;
  }
  @keyframes region-breathe { 0%,100%{stroke-opacity:0.25} 50%{stroke-opacity:0.7} }
  .region:hover { fill:rgba(255,255,255,0.06); stroke:var(--accent); }
  .region.active { stroke:var(--accent); stroke-width:0.9; animation:none; }

  .badge circle { fill:rgba(252,250,244,0.92); stroke:rgba(45,35,20,0.4); stroke-width:0.4; pointer-events:none; }
  .badge text {
    fill:#2b2620; font-size:4.4px; font-family:'Nanum Myeongjo',serif;
    text-anchor:middle; dominant-baseline:central; pointer-events:none;
  }
  .badge { transition:opacity 0.3s; }
  .has-active .badge { opacity:0.15; }
  .has-active .badge.badge-active { opacity:1; }
  .badge.badge-active circle { stroke:var(--accent); }
  .badge.badge-active text { fill:var(--accent); }

  .guide-text { margin-top:16px; font-size:18px; color:var(--dim); text-align:center; line-height:1.7; }

  /* 스티키 축소 카드 */
  .card-sticky {
    position:sticky; top:10px; z-index:20;
    display:flex; justify-content:center;
    width:100%;
  }

  /* 썸네일 번호 칩 */
  .pick-num {
    position:absolute; top:2px; left:2px;
    min-width:16px; height:16px;
    background:rgba(255,253,247,0.92);
    border:1px solid rgba(156,123,53,0.5);
    border-radius:5px;
    font-size:10px; color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:0 2px;
  }

  /* 카드 이야기 섹션 */
  .scroll-hint {
    margin-top:20px; font-size:16px; color:var(--accent);
    opacity:0.85; animation:hint-bob 2s ease-in-out infinite;
  }
  @keyframes hint-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }
  .card-desc {
    width:min(92vw, 420px);
    margin-top:28px;
    padding-bottom:40px;
  }
  .card-desc h2 {
    display:flex; align-items:center; gap:12px;
    font-size:15px; font-weight:700;
    color:var(--accent); letter-spacing:4px;
    margin-bottom:16px;
  }
  .card-desc h2::after { content:''; flex:1; height:1px; background:rgba(156,123,53,0.25); }
  .card-desc p {
    font-size:22px; line-height:1.95;
    word-break:keep-all; color:#3a342b;
    background:#fffdf7;
    border:1px solid rgba(156,123,53,0.25);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:14px;
    box-shadow:0 6px 20px rgba(60,45,20,0.1);
  }

  /* 바텀 시트 */
  .sheet-backdrop {
    position:fixed; inset:0; background:rgba(40,32,20,0.12);
    opacity:0; pointer-events:none; transition:opacity 0.35s ease; z-index:90;
  }
  .sheet-backdrop.open { opacity:1; pointer-events:auto; }
  .sheet {
    position:fixed; left:0; right:0; bottom:0;
    max-height:52vh;
    background:#fffdf7;
    border-radius:22px 22px 0 0;
    box-shadow:0 -1px 0 rgba(156,123,53,0.4), 0 -16px 48px rgba(60,45,20,0.25);
    padding:16px 28px calc(32px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform 0.45s cubic-bezier(.22,.9,.28,1);
    z-index:100; overflow-y:auto; overscroll-behavior:contain;
  }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:40px; height:4px; background:rgba(0,0,0,0.16); border-radius:3px; margin:0 auto 22px; }
  .sheet-close {
    position:absolute; top:22px; right:22px;
    width:38px; height:38px;
    border:1px solid rgba(0,0,0,0.13); border-radius:50%;
    background:transparent; color:var(--dim);
    font-size:16px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .sheet-eyebrow { text-align:center; font-size:12px; letter-spacing:5px; color:var(--accent); opacity:0.9; margin-bottom:10px; }
  .sheet-title { text-align:center; font-size:30px; font-weight:800; line-height:1.3; word-break:keep-all; margin-bottom:16px; }
  .sheet-chips { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:6px 0; margin-bottom:26px; }
  .chip { font-size:17px; color:var(--accent); white-space:nowrap; }
  .chip + .chip::before { content:'·'; color:var(--dim); margin:0 14px; }
  .sheet-quote {
    text-align:center; font-size:24px; font-weight:700; line-height:1.7;
    color:#3d3426; word-break:keep-all; padding:0 14px; margin-bottom:12px;
  }
  .sheet-divider {
    display:flex; align-items:center; gap:14px;
    margin:12px 0 26px; color:var(--accent); opacity:0.7; font-size:11px;
  }
  .sheet-divider::before, .sheet-divider::after { content:''; flex:1; height:1px; background:rgba(156,123,53,0.3); }
  .sheet-sec { margin-bottom:24px; }
  .sheet-sec:last-child { margin-bottom:0; }
  .sheet-sec h3 { font-size:14px; font-weight:700; color:var(--accent); letter-spacing:4px; margin-bottom:10px; }
  .sheet-sec p { font-size:22px; line-height:1.95; color:#3a342b; word-break:keep-all; }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="index.html">← 처음으로</a>
  <h1>CARD LIBRARY</h1>
  <div class="card-title" id="card-title"></div>
  <div class="card-title-en" id="card-title-en"></div>

  <div class="picker" id="picker"></div>

  <div class="card-sticky" id="card-sticky">
  <div class="card-wrap" id="card-wrap">
    <img class="card-img" id="card-img" alt="">
    <svg class="overlay-svg" id="overlay" viewBox="0 0 100 166.7" preserveAspectRatio="none">
      <defs>
        <mask id="spot-mask">
          <rect x="0" y="0" width="100" height="166.7" fill="white"/>
          <g id="mask-hole"></g>
        </mask>
      </defs>
      <rect id="dimmer" x="0" y="0" width="100" height="166.7" mask="url(#spot-mask)"/>
      <g id="regions"></g>
      <g id="badges"></g>
    </svg>
  </div>
  </div>

  <p class="guide-text" id="guide-text"></p>
  <p class="scroll-hint">▼ 아래로 내리면 카드 이야기</p>

  <div class="card-desc">
    <h2>카드 이야기</h2>
    <div id="card-desc-body"></div>
  </div>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheet-close" aria-label="닫기">✕</button>
  <div class="sheet-eyebrow" id="sheet-eyebrow"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-chips" id="sheet-chips"></div>
  <div class="sheet-quote" id="sheet-quote"></div>
  <div class="sheet-divider">✦</div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script src="symbols.js"></script>
<script>
const ALL_CARDS = ['00_fool','01_magician','02_high_priestess','03_empress','04_emperor','05_hierophant','06_lovers','07_chariot','08_strength','09_hermit','10_wheel_of_fortune','11_justice','12_hanged_man','13_death','14_temperance','15_devil','16_tower','17_star','18_moon','19_sun','20_judgement','21_world'];
const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const KO_NAMES = ['바보','마법사','여사제','여황제','황제','교황','연인','전차','힘','은둔자','운명의 수레바퀴','정의','매달린 사람','죽음','절제','악마','탑','별','달','태양','심판','세계'];

const SYM = window.TAROT_SYMBOLS;
const VH = 166.7; // viewBox 높이 (3:5 비율)
let currentId = null;

// ── 카드 선택 스트립 ──
const picker = document.getElementById('picker');
ALL_CARDS.forEach((f, id) => {
  const t = document.createElement('div');
  const ready = !!SYM[id];
  t.className = 'pick-thumb' + (ready ? ' ready' : '');
  t.innerHTML = `<img src="cards/${f}.webp" alt="${KO_NAMES[id]}">` +
                `<span class="pick-num">${id}</span>` +
                (ready ? '' : '<span class="soon">준비 중</span>');
  if (ready) t.onclick = () => loadCard(id);
  picker.appendChild(t);
});

// ── 카드 로드 (데이터 기반 자동 렌더링) ──
function loadCard(id) {
  currentId = id;
  const data = SYM[id];
  closeSheet();

  document.querySelectorAll('.pick-thumb').forEach((t, i) =>
    t.classList.toggle('active', i === id));

  document.getElementById('card-title').textContent = `${ROMAN[id]} · ${data.name}`;
  document.getElementById('card-title-en').textContent = data.nameEn;
  const descBody = document.getElementById('card-desc-body');
  descBody.innerHTML = '';
  (data.desc || []).forEach(t => {
    const p = document.createElement('p');
    p.textContent = t;
    descBody.appendChild(p);
  });
  window.scrollTo({ top: 0 });
  document.getElementById('card-img').src = data.file;
  document.getElementById('guide-text').innerHTML =
    `그림 위 ${data.parts.length}개의 영역을 터치하면<br>각 상징의 숨은 의미가 나타납니다`;

  const regions = document.getElementById('regions');
  const badges = document.getElementById('badges');
  regions.innerHTML = ''; badges.innerHTML = '';

  data.parts.forEach((part, i) => {
    const [x, y, w, h] = part.box;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('class', 'region');
    r.setAttribute('x', x); r.setAttribute('y', y * VH / 100);
    r.setAttribute('width', w); r.setAttribute('height', h * VH / 100);
    r.setAttribute('rx', 2);
    r.addEventListener('click', (e) => { e.stopPropagation(); openPart(i); });
    regions.appendChild(r);

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'badge');
    g.dataset.idx = i;
    g.innerHTML = `<circle cx="${x}" cy="${y * VH / 100}" r="3.2"/>` +
                  `<text x="${x}" y="${y * VH / 100 + 0.2}">${i + 1}</text>`;
    badges.appendChild(g);
  });
}

// ── 카드 축소 공통 ──
const cardWrapEl = document.getElementById('card-wrap');
function baseWidth() { return Math.min(window.innerWidth * 0.88, 380); }

// ── 상징 터치 → 스포트라이트 + 시트 ──
const overlay = document.getElementById('overlay');
const maskHole = document.getElementById('mask-hole');
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('sheet-backdrop');

let sheetOpen = false;

function fitCardAboveSheet() {
  // 시트(52vh) 위 남는 공간에 카드 전체가 들어가게 축소
  const availH = window.innerHeight * 0.46 - 30;
  const w = Math.max(140, Math.min(availH * 0.6, baseWidth()));
  cardWrapEl.style.width = w + 'px';
}

function openPart(i) {
  const data = SYM[currentId];
  const part = data.parts[i];

  sheetOpen = true;
  fitCardAboveSheet();
  // 스티키 카드가 화면 상단에 붙도록 스크롤
  const st = document.getElementById('card-sticky').getBoundingClientRect().top;
  if (st > 12) window.scrollTo({ top: window.scrollY + st - 10, behavior: 'smooth' });

  document.querySelectorAll('.region').forEach((r, j) =>
    r.classList.toggle('active', j === i));
  document.querySelectorAll('.badge').forEach(b =>
    b.classList.toggle('badge-active', +b.dataset.idx === i));
  overlay.classList.add('has-active');

  const [x, y, w, h] = part.box;
  maskHole.innerHTML = `<rect x="${x}" y="${y * VH / 100}" width="${w}" height="${h * VH / 100}" rx="2" fill="black"/>`;

  document.getElementById('sheet-eyebrow').textContent = data.nameEn + ' · SYMBOL';
  document.getElementById('sheet-title').textContent = part.label;
  const chips = document.getElementById('sheet-chips');
  chips.innerHTML = '';
  part.keywords.forEach(k => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = k;
    chips.appendChild(c);
  });
  document.getElementById('sheet-quote').textContent = part.quote;
  const body = document.getElementById('sheet-body');
  body.innerHTML = '';
  part.sections.forEach(sec => {
    const d = document.createElement('div');
    d.className = 'sheet-sec';
    d.innerHTML = `<h3>${sec.h}</h3>`;
    const p = document.createElement('p');
    p.textContent = sec.p;
    d.appendChild(p);
    body.appendChild(d);
  });
  sheet.classList.add('open');
  backdrop.classList.add('open');
  sheet.scrollTop = 0;
}

function closeSheet() {
  const wasOpen = sheetOpen;
  sheetOpen = false;
  sheet.classList.remove('open');
  // 시트를 닫으면 카드 화면(맨 위)으로 복귀
  if (wasOpen) window.scrollTo({ top: 0, behavior: 'smooth' });
  onScroll();
  backdrop.classList.remove('open');
  document.querySelectorAll('.region').forEach(r => r.classList.remove('active'));
  document.querySelectorAll('.badge').forEach(b => b.classList.remove('badge-active'));
  overlay.classList.remove('has-active');
  maskHole.innerHTML = '';
}
document.getElementById('sheet-close').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);
document.getElementById('card-wrap').addEventListener('click', closeSheet);

// ── 스크롤하면 카드 축소 ──
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    if (sheetOpen) { fitCardAboveSheet(); ticking = false; return; }
    const progress = Math.min(Math.max(window.scrollY / 280, 0), 1);
    const w = baseWidth() - progress * (baseWidth() - 150);
    cardWrapEl.style.width = w + 'px';
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);

// 첫 카드 로드 (데이터 있는 첫 번째)
loadCard(+Object.keys(SYM)[0]);
</script>
</body>
</html>
