<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신비의 타로</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F1E7">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="신비의 타로">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#f6f1e7; --bg-warm:#f9f0df;
    --text:#2b2620; --dim:#9a9183; --accent:#9c7b35;
    --card-face:#fffdf7;
    /* ── 모션 규칙: 곡선은 하나, 시간은 거리에 비례 ── */
    --ease: cubic-bezier(.3,.55,.25,1);
    --dur-s: 0.4s;   /* 페이드·작은 변화 */
    --dur-m: 0.6s;   /* 카드 선택·이동 */
    --dur-l: 0.8s;   /* 무대·화면 단위 이동 */
  }
  html, body { min-height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Nanum Myeongjo',serif;
    transition:background 1.6s ease;
    overflow-x:hidden;
  }
  body.warm { background:var(--bg-warm); }

  .screen { display:none; }
  .screen.active {
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    padding:30px 16px 40px;
  }

  .orn { font-size:13px; color:var(--accent); letter-spacing:8px; margin-bottom:14px; }
  .back-link {
    align-self:flex-start;
    font-size:17px; color:var(--dim);
    background:none; border:none; font-family:inherit;
    padding:10px 14px; margin:-10px 0 4px -6px;
    cursor:pointer;
  }

  /* ─── 허브 ─── */
  #screen-hub { justify-content:center; }
  #screen-hub h1 { font-size:38px; font-weight:800; margin-bottom:8px; }
  .tagline { font-size:16px; color:var(--dim); letter-spacing:2px; margin-bottom:48px; }
  .menu { display:flex; flex-direction:column; gap:20px; width:min(90vw, 400px); }
  .menu-card {
    display:block; text-decoration:none; color:var(--text);
    background:var(--card-face);
    border:1px solid rgba(156,123,53,0.3);
    border-radius:16px;
    padding:30px 30px 28px;
    box-shadow:0 8px 30px rgba(60,45,20,0.12);
    position:relative; cursor:pointer;
    font-family:inherit; text-align:left; width:100%;
    transition:transform 0.25s;
  }
  .menu-card:active { transform:scale(0.98); }
  .menu-card::after {
    content:'→';
    position:absolute; right:26px; top:50%;
    transform:translateY(-50%);
    font-size:22px; color:var(--accent);
  }
  .menu-num { font-size:12px; letter-spacing:4px; color:var(--accent); margin-bottom:10px; }
  .menu-title { font-size:25px; font-weight:700; margin-bottom:8px; }
  .menu-desc { font-size:16px; color:var(--dim); line-height:1.6; word-break:keep-all; padding-right:30px; }
  .hub-foot { margin-top:44px; font-size:12px; color:var(--dim); opacity:0.7; letter-spacing:1px; }

  .install-btn {
    display:none;
    margin-top:24px;
    font-family:inherit; font-size:18px;
    color:var(--accent); background:rgba(156,123,53,0.08);
    border:1px solid rgba(156,123,53,0.45);
    border-radius:999px;
    padding:14px 30px;
    cursor:pointer;
  }
  .install-btn.show { display:block; }
  .install-btn:active { background:rgba(156,123,53,0.16); }

  .ios-guide {
    display:none;
    margin-top:18px;
    width:min(90vw, 400px);
    background:var(--card-face);
    border:1px solid rgba(156,123,53,0.3);
    border-radius:14px;
    padding:18px 20px;
    font-size:17px; line-height:1.8;
    color:var(--text); word-break:keep-all;
  }
  .ios-guide.show { display:block; }
  .ios-guide b { color:var(--accent); }

  /* ─── 운세 선택 ─── */
  #screen-fortune h1 { font-size:27px; font-weight:800; margin-bottom:8px; text-align:center; }
  #screen-fortune .sub2 { font-size:18px; color:var(--dim); margin-bottom:30px; text-align:center; }
  .fortune-grid {
    display:grid; grid-template-columns:1fr 1fr;
    gap:16px; width:min(92vw, 420px);
  }
  .fortune-card {
    background:var(--card-face);
    border:1px solid rgba(156,123,53,0.3);
    border-radius:16px;
    padding:26px 14px 22px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(60,45,20,0.1);
    transition:transform 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color:transparent;
  }
  .fortune-card:active { transform:scale(0.96); border-color:var(--accent); }
  .f-emoji { font-size:40px; }
  .f-name { font-size:22px; font-weight:800; }
  .f-desc { font-size:14px; color:var(--dim); text-align:center; line-height:1.5; word-break:keep-all; }

  /* ─── 뽑기 (리추얼) ─── */
  .step-label { font-size:13px; letter-spacing:4px; color:var(--accent); margin-bottom:14px; }
  .headline {
    font-size:28px; font-weight:800;
    text-align:center; line-height:1.4; word-break:keep-all;
    margin-bottom:8px; transition:opacity 0.4s;
    min-height:calc(1.4em * 2);
    display:flex; align-items:center; justify-content:center;
  }
  .subline {
    font-size:19px; color:var(--dim);
    text-align:center; line-height:1.6; word-break:keep-all;
    margin-bottom:6px; transition:opacity 0.4s;
    min-height:calc(1.6em * 2);
    display:flex; align-items:flex-start; justify-content:center;
  }

  .stage {
    position:relative;
    width:min(94vw, 420px); height:400px;
    display:flex; align-items:center; justify-content:center;
    transition:height var(--dur-l) var(--ease);
    flex:none;
  }
  .stage.compact { height:235px; }
  .stage.hidden-stage { height:0; overflow:hidden; }
  .stage::before {
    content:'';
    position:absolute;
    width:min(86vw, 370px); aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle, rgba(156,123,53,0.09), rgba(156,123,53,0.02) 70%, transparent);
    transition:opacity 0.5s;
  }
  .stage.compact::before { opacity:0.4; }

  .fan-card {
    position:absolute;
    width:100px; height:162px;
    left:50%; top:50%;
    margin:-81px 0 0 -50px;
    transform-origin:50% 120%;
    cursor:pointer;
    transition:transform var(--dur-m) var(--ease), opacity var(--dur-s) var(--ease);
    perspective:800px;
    -webkit-tap-highlight-color:transparent;
  }
  .card-inner {
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform 1.1s var(--ease);
  }
  .fan-card.flipped .card-inner { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0;
    border-radius:11px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:1.5px solid var(--accent);
    box-shadow:0 8px 26px rgba(60,45,20,0.2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--card-face);
  }
  .face.back::before {
    content:'';
    position:absolute; inset:7px;
    border:1px solid rgba(156,123,53,0.4);
    border-radius:6px;
  }
  .back-star { font-size:34px; color:var(--accent); }
  .back-rays { font-size:11px; color:rgba(156,123,53,0.55); letter-spacing:4px; margin-top:8px; }
  .face.front {
    transform:rotateY(180deg);
    padding:0; overflow:hidden; text-align:center;
  }
  .front-img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; border-radius:10px;
  }
  .front-label {
    position:absolute; bottom:5px; left:5px; right:5px;
    background:rgba(255,253,247,0.9);
    border:1px solid rgba(156,123,53,0.35);
    border-radius:6px;
    font-size:11px; font-weight:800;
    padding:3px 2px; color:var(--text);
  }

  .fan-card.chosen { transform:translateY(-26px) scale(1.55) !important; z-index:50; }
  .fan-card.risen {
    transform:translateY(0) scale(1.22) !important;
    z-index:50; cursor:default;
    transition:transform var(--dur-l) var(--ease), opacity var(--dur-s) var(--ease);
  }
  .fan-card.faded { opacity:0.18; pointer-events:none; }
  .fan-card.gone { opacity:0; pointer-events:none; }

  .interp {
    width:min(92vw, 420px);
    opacity:0; transform:translateY(16px);
    transition:opacity var(--dur-m) var(--ease), transform var(--dur-m) var(--ease);
    display:none; margin-bottom:10px;
  }
  .interp.visible { opacity:1; transform:none; }
  .interp-head {
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:12px;
  }
  .interp-badge {
    font-size:16px; color:var(--accent);
    border:1px solid rgba(156,123,53,0.45);
    border-radius:999px; padding:5px 16px;
  }
  .interp-card-name { font-size:20px; font-weight:700; }
  .interp-text {
    font-size:23px; line-height:1.95;
    word-break:keep-all; text-align:left;
    background:var(--card-face);
    border:1px solid rgba(156,123,53,0.25);
    border-radius:14px;
    padding:20px 22px;
    box-shadow:0 6px 20px rgba(60,45,20,0.1);
  }

  .final-row { display:none; gap:14px; justify-content:center; margin:6px 0 18px; }
  .final-row.visible { display:flex; }
  .mini-card {
    width:84px; height:158px;
    overflow:hidden;
    border:1.5px solid var(--accent);
    border-radius:9px; background:var(--card-face);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; box-shadow:0 5px 14px rgba(60,45,20,0.15);
    opacity:0; transform:translateY(10px);
    animation:mini-in 0.5s ease forwards;
  }
  .mini-card:nth-child(2) { animation-delay:0.12s; }
  .mini-card:nth-child(3) { animation-delay:0.24s; }
  @keyframes mini-in { to { opacity:1; transform:none; } }
  .mini-img { width:100%; height:104px; object-fit:cover; }
  .mini-name { font-size:13px; font-weight:700; }
  .mini-time { font-size:10px; color:var(--accent); }

  .detail-toggle {
    display:none;
    width:min(92vw, 420px);
    font-family:inherit; font-size:19px;
    color:var(--accent); background:none;
    border:1px solid rgba(156,123,53,0.4);
    border-radius:12px;
    padding:15px 0; cursor:pointer;
    margin-bottom:12px;
  }
  .detail-toggle.visible { display:block; }
  .detail-toggle:active { background:rgba(156,123,53,0.08); }
  .detail-list {
    width:min(92vw, 420px);
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height var(--dur-l) var(--ease), opacity var(--dur-m) var(--ease);
    margin-bottom:8px;
  }
  .detail-list.open { max-height:1600px; opacity:1; }
  .detail-item {
    background:var(--card-face);
    border:1px solid rgba(156,123,53,0.25);
    border-radius:14px;
    padding:18px 20px; margin-bottom:12px;
    box-shadow:0 5px 16px rgba(60,45,20,0.08);
  }
  .detail-head { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .detail-badge {
    font-size:14px; color:var(--accent);
    border:1px solid rgba(156,123,53,0.45);
    border-radius:999px; padding:3px 13px;
  }
  .detail-name { font-size:18px; font-weight:700; }
  .detail-text { font-size:21px; line-height:1.9; word-break:keep-all; }

  .actions {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    min-height:150px; margin-top:4px;
  }
  .btn-main {
    width:min(88vw, 360px); padding:21px 0;
    font-family:inherit; font-size:21px; font-weight:700;
    color:var(--card-face); background:var(--accent);
    border:none; border-radius:999px;
    box-shadow:0 8px 24px rgba(156,123,53,0.4);
    cursor:pointer;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity var(--dur-s) var(--ease), transform var(--dur-s) var(--ease);
  }
  .btn-main.on { opacity:1; pointer-events:auto; transform:translateY(0); }
  .btn-sub {
    font-family:inherit; font-size:18px;
    color:var(--dim); background:none; border:none;
    padding:14px 28px; cursor:pointer;
    text-decoration:underline; text-underline-offset:5px;
    text-decoration-color:rgba(154,145,131,0.5);
    opacity:0; pointer-events:none;
    transition:opacity var(--dur-s) var(--ease);
  }
  .btn-sub.on { opacity:1; pointer-events:auto; }

  .dots { display:flex; gap:10px; margin-top:14px; }
  .dot { width:9px; height:9px; border-radius:50%; background:rgba(156,123,53,0.25); transition:all 0.4s; }
  .dot.done { background:var(--accent); box-shadow:0 0 8px rgba(156,123,53,0.5); }
</style>
</head>
<body>

<!-- ━━━ 허브 ━━━ -->
<div class="screen active" id="screen-hub">
  <div class="orn">✦ ✦ ✦</div>
  <h1>신비의 타로</h1>
  <p class="tagline">MYSTIC TAROT</p>
  <nav class="menu">
    <button class="menu-card" onclick="goScreen('fortune')">
      <div class="menu-num">READING ── 01</div>
      <div class="menu-title">타로 점 보기</div>
      <div class="menu-desc">세 장의 카드로 재물 · 연애 · 건강 · 진로의 흐름을 읽어 드립니다</div>
    </button>
    <a class="menu-card" href="cards.html">
      <div class="menu-num">LIBRARY ── 02</div>
      <div class="menu-title">카드 도감</div>
      <div class="menu-desc">카드 속 그림을 터치하며 상징의 숨은 의미를 알아보세요</div>
    </a>
  </nav>
  <button class="install-btn" id="install-btn">📲 휴대폰에 앱으로 받기</button>
  <div class="ios-guide" id="ios-guide">
    아이폰에서는 Safari 하단의 <b>공유 버튼(↑)</b>을 누른 뒤<br>
    <b>"홈 화면에 추가"</b>를 선택하면 앱으로 설치됩니다.
  </div>

  <p class="hub-foot">✦ 당신의 오늘에 작은 빛이 되기를 ✦</p>
</div>

<!-- ━━━ 운세 선택 ━━━ -->
<div class="screen" id="screen-fortune">
  <button class="back-link" onclick="goScreen('hub')">← 처음으로</button>
  <div class="orn">✦ ✦ ✦</div>
  <h1>무엇을 알고 싶으신가요</h1>
  <p class="sub2">오늘 당신에게 필요한 운세를 선택하세요</p>
  <div class="fortune-grid">
    <div class="fortune-card" onclick="startReading('wealth')">
      <span class="f-emoji">💰</span><span class="f-name">재물운</span>
      <span class="f-desc">돈과 풍요,<br>재정의 흐름</span>
    </div>
    <div class="fortune-card" onclick="startReading('love')">
      <span class="f-emoji">💜</span><span class="f-name">연애운</span>
      <span class="f-desc">사랑과 인연,<br>관계의 흐름</span>
    </div>
    <div class="fortune-card" onclick="startReading('health')">
      <span class="f-emoji">🌿</span><span class="f-name">건강운</span>
      <span class="f-desc">몸과 마음의<br>균형</span>
    </div>
    <div class="fortune-card" onclick="startReading('career')">
      <span class="f-emoji">⭐</span><span class="f-name">진로운</span>
      <span class="f-desc">학업, 직업,<br>성장의 길</span>
    </div>
  </div>
</div>

<!-- ━━━ 카드 뽑기 (리추얼) ━━━ -->
<div class="screen" id="screen-draw">
  <div class="step-label" id="step-label"></div>
  <h1 class="headline" id="headline"></h1>
  <p class="subline" id="subline"></p>

  <div class="stage" id="stage"></div>
  <div class="final-row" id="final-row"></div>

  <div class="interp" id="interp">
    <div class="interp-head">
      <span class="interp-badge" id="interp-badge"></span>
      <span class="interp-card-name" id="interp-name"></span>
    </div>
    <p class="interp-text" id="interp-text"></p>
  </div>

  <button class="detail-toggle" id="detail-toggle">세 카드의 상세 풀이 보기 ▾</button>
  <div class="detail-list" id="detail-list"></div>

  <div class="actions">
    <button class="btn-main" id="btn-main"></button>
    <button class="btn-sub" id="btn-sub"></button>
  </div>

  <div class="dots">
    <div class="dot" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
  </div>
</div>

<script>
/* ═══ 카드 데이터 (원본 tarot.html에서 추출) ═══ */
const CARDS = [
  { id: 0, name: '바보', emoji: '🎭', keyword: '새 출발, 자유', roman: '0 · The Fool' },
  { id: 1, name: '마법사', emoji: '🪄', keyword: '의지, 창조력', roman: 'I · The Magician' },
  { id: 2, name: '여사제', emoji: '🌙', keyword: '직관, 신비', roman: 'II · High Priestess' },
  { id: 3, name: '여황제', emoji: '🌸', keyword: '풍요, 모성', roman: 'III · The Empress' },
  { id: 4, name: '황제', emoji: '👑', keyword: '권위, 안정', roman: 'IV · The Emperor' },
  { id: 5, name: '교황', emoji: '⛪', keyword: '전통, 지혜', roman: 'V · The Hierophant' },
  { id: 6, name: '연인', emoji: '💑', keyword: '선택, 사랑', roman: 'VI · The Lovers' },
  { id: 7, name: '전차', emoji: '⚡', keyword: '승리, 전진', roman: 'VII · The Chariot' },
  { id: 8, name: '힘', emoji: '🦁', keyword: '용기, 내면의 힘', roman: 'VIII · Strength' },
  { id: 9, name: '은둔자', emoji: '🕯️', keyword: '성찰, 고독', roman: 'IX · The Hermit' },
  { id: 10, name: '운명의 수레바퀴', emoji: '☸️', keyword: '전환점, 운명', roman: 'X · Wheel of Fortune' },
  { id: 11, name: '정의', emoji: '⚖️', keyword: '균형, 공정', roman: 'XI · Justice' },
  { id: 12, name: '매달린 사람', emoji: '🙃', keyword: '희생, 관조', roman: 'XII · The Hanged Man' },
  { id: 13, name: '죽음', emoji: '🌑', keyword: '변화, 끝과 시작', roman: 'XIII · Death' },
  { id: 14, name: '절제', emoji: '🌊', keyword: '균형, 조화', roman: 'XIV · Temperance' },
  { id: 15, name: '악마', emoji: '🔗', keyword: '집착, 유혹', roman: 'XV · The Devil' },
  { id: 16, name: '탑', emoji: '⚡🗼', keyword: '급변, 각성', roman: 'XVI · The Tower' },
  { id: 17, name: '별', emoji: '⭐', keyword: '희망, 치유', roman: 'XVII · The Star' },
  { id: 18, name: '달', emoji: '🌕', keyword: '환상, 불안', roman: 'XVIII · The Moon' },
  { id: 19, name: '태양', emoji: '☀️', keyword: '성공, 기쁨', roman: 'XIX · The Sun' },
  { id: 20, name: '심판', emoji: '📯', keyword: '각성, 부활', roman: 'XX · Judgement' },
  { id: 21, name: '세계', emoji: '🌍', keyword: '완성, 성취', roman: 'XXI · The World' },
];

    18: { past:'진로에 대한 불안이나 혼란의 안개가 짙었던 시기가 있었습니다.', present:'달빛의 혼란에 흔들리지 마세요. 불확실한 정보보다 자신의 본질에 집중하세요.', future:'안개가 걷히면 명확한 진로 방향이 달처럼 떠오릅니다.' },
    19: { past:'성공적인 성과와 인정받던 밝은 시절이 있었습니다.', present:'태양이 가장 높이 떠 있습니다. 지금 당신의 능력이 가장 빛나는 시기입니다.', future:'큰 성공과 밝은 미래가 태양처럼 환하게 열립니다.' },
    20: { past:'진로에서 중요한 깨달음이 나팔 소리처럼 울렸습니다.', present:'기회가 눈앞에 있습니다. 나팔 소리에 응답하듯 망설임 없이 잡으세요.', future:'삶을 바꾸는 진로 전환이 이루어집니다. 심판의 날이 축복으로 찾아옵니다.' },
    21: { past:'오랜 목표를 달성한 완성의 경험이 있습니다. 그 여정이 지금을 만들었습니다.', present:'최고의 성취를 향한 마지막 단계에 있습니다. 세계가 당신을 기다리고 있습니다.', future:'완전한 성공과 성취가 실현됩니다. 세계가 당신 것입니다.' },
  }
};

const OVERALL = {

    '빈손으로 절벽 끝에 섰던 당신이, 이제 황금빛 바람을 맞이할 준비가 되었습니다. 세 장의 카드가 말합니다—당신의 재물 이야기는 아직 쓰이고 있다고.',
    '운명의 수레바퀴는 멈추지 않습니다. 오르고 내리는 흐름 속에서 당신은 중심을 잡을 줄 아는 사람입니다. 풍요는 그 균형 위에 내려앉습니다.',

  ],
  health: [
    '몸과 마음은 하나의 우주입니다. 세 장의 카드가 보여줍니다—지금의 작은 선택들이 내일의 당신을 만들고 있다는 것을.',
    '가장 큰 치유는 자기 자신을 돌보는 것에서 시작됩니다. 별빛처럼 조용히, 그러나 확실하게 당신의 몸이 회복을 향해 나아가고 있습니다.',
    '당신의 몸은 더 나아지기를 원하고 있습니다. 그 신호에 귀 기울이고, 한 걸음씩 나아가세요. 세계가 당신의 건강을 응원합니다.',
  ],

    '진로는 직선이 아닙니다. 돌아가는 것처럼 보여도 결국 당신이 있어야 할 곳으로 향하고 있습니다. 세 장의 카드가 그 여정을 증명합니다.',
    '과거의 경험, 현재의 선택, 미래의 가능성이 하나의 강처럼 흐릅니다. 당신은 이미 그 강의 일부입니다. 흐름을 믿으세요.',
    '별들은 이미 당신의 성공을 알고 있습니다. 다만 그 문은 당신이 열어야 합니다. 두려움 없이 손잡이를 잡으세요.',
  ],

/* ═══ 카드 이미지 파일 ═══ */
const CARD_FILES = ['00_fool','01_magician','02_high_priestess','03_empress','04_emperor','05_hierophant','06_lovers','07_chariot','08_strength','09_hermit','10_wheel_of_fortune','11_justice','12_hanged_man','13_death','14_temperance','15_devil','16_tower','17_star','18_moon','19_sun','20_judgement','21_world'].map(n => 'cards/' + n + '.webp');

/* ═══ 공통 ═══ */
const FORTUNE_NAMES = { wealth:'재물운', love:'연애운', health:'건강운', career:'진로운' };
const TIME_TAGS = ['PAST ── 과거의 카드', 'PRESENT ── 현재의 카드', 'FUTURE ── 미래의 카드'];
const TIME_KO = ['과거', '현재', '미래'];
const TIME_KEYS = ['past', 'present', 'future'];

function goScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

/* ═══ 뽑기 상태 ═══ */
const stage = document.getElementById('stage');
const headline = document.getElementById('headline');
const subline = document.getElementById('subline');
const btnMain = document.getElementById('btn-main');
const btnSub = document.getElementById('btn-sub');
const interp = document.getElementById('interp');

let fortune = null;
let deck = [];
let step = 0;
let state = 'pick';
let shuffling = false;
let chosenEl = null;
let picks = [];

function setText(h, s) {
  headline.style.opacity = 0; subline.style.opacity = 0;
  setTimeout(() => {
    headline.innerHTML = h; subline.textContent = s;
    headline.style.opacity = 1; subline.style.opacity = 1;
  }, 280);
}
function showBtns(mainTxt, subTxt) {
  if (mainTxt) { btnMain.textContent = mainTxt; btnMain.classList.add('on'); }
  else btnMain.classList.remove('on');
  if (subTxt) { btnSub.textContent = subTxt; btnSub.classList.add('on'); }
  else btnSub.classList.remove('on');
}

function startReading(f) {
  fortune = f;
  deck = [...Array(22).keys()].sort(() => Math.random() - 0.5);
  step = 0; state = 'pick'; picks = []; chosenEl = null;
  document.body.classList.remove('warm');
  stage.classList.remove('compact', 'hidden-stage');
  interp.classList.remove('visible'); interp.style.display = 'none';
  document.getElementById('final-row').classList.remove('visible');
  document.getElementById('detail-toggle').classList.remove('visible');
  document.getElementById('detail-list').classList.remove('open');
  document.getElementById('detail-toggle').textContent = '세 카드의 상세 풀이 보기 ▾';
  [0,1,2].forEach(i => document.getElementById('dot-' + i).classList.remove('done'));
  document.getElementById('step-label').textContent = FORTUNE_NAMES[f] + ' · ' + TIME_TAGS[0];
  goScreen('draw');
  setText('마음이 끌리는 카드를<br>골라 보세요', '아무 카드나 좋습니다. 첫 느낌을 믿으세요.');
  showBtns(null, '다시 섞기');
  buildFan();
}

function cardPose(i, N) {
  const mid = (N-1)/2;
  return `translate(${(i-mid)*74}px, ${Math.abs(i-mid)*14}px) rotate(${(i-mid)*5}deg)`;
}

function buildFan(shuffleFx) {
  stage.querySelectorAll('.fan-card').forEach(c => c.remove());
  const N = 5;
  for (let i = 0; i < N; i++) {
    const card = document.createElement('div');
    card.className = 'fan-card';
    const pose = cardPose(i, N);
    card.style.transform = pose;
    card.style.zIndex = 10 + i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="face back"><span class="back-star">✦</span><span class="back-rays">✧ ✧ ✧</span></div>
        <div class="face front"></div>
      </div>`;
    card.onclick = () => choose(card);
    stage.appendChild(card);
    if (shuffleFx) {
      const r = (Math.random()*8)-4;
      card.animate(
        [{ transform:`translate(0,-4px) rotate(${r}deg) scale(0.96)` },
         { transform:`translate(0,-4px) rotate(${r}deg) scale(0.96)`, offset:0.3 },
         { transform:pose }],
        { duration:650, delay:120+i*85, easing:'cubic-bezier(.3,.55,.25,1)', fill:'backwards' });
    } else {
      card.animate(
        [{ transform:'translate(0,60px) rotate(0deg)', opacity:0 },
         { transform:pose, opacity:1 }],
        { duration:650, delay:i*70, easing:'cubic-bezier(.3,.55,.25,1)', fill:'backwards' });
    }
  }
}

function choose(card) {
  if (state !== 'pick' || shuffling) return;
  state = 'confirm';
  chosenEl = card;
  stage.querySelectorAll('.fan-card').forEach(c => { if (c !== card) c.classList.add('faded'); });
  card.classList.add('chosen');
  setText('이 카드가 당신의 것입니다', `${TIME_KO[step]}의 카드 · 준비되면 뒤집어 보세요`);
  showBtns('뒤집어 보기', '다른 카드 고르기');
}

function revertToPick() {
  if (state !== 'confirm') return;
  state = 'pick';
  chosenEl.classList.remove('chosen');
  stage.querySelectorAll('.fan-card').forEach(c => c.classList.remove('faded'));
  chosenEl = null;
  setText('마음이 끌리는 카드를<br>골라 보세요', '아무 카드나 좋습니다. 첫 느낌을 믿으세요.');
  showBtns(null, '다시 섞기');
}

document.addEventListener('click', (e) => {
  if (state !== 'confirm') return;
  if (e.target.closest('.fan-card') || e.target.closest('.btn-main') || e.target.closest('.btn-sub')) return;
  revertToPick();
});

btnSub.onclick = () => {
  if (state === 'pick') {
    if (shuffling) return;
    shuffling = true;
    btnSub.style.pointerEvents = 'none';
    const cards = [...stage.querySelectorAll('.fan-card')];
    cards.forEach((cd, i) => {
      const r = (Math.random()*8)-4;
      cd.animate(
        [{ transform: cd.style.transform },
         { transform: `translate(0,-4px) rotate(${r}deg) scale(0.96)` }],
        { duration:380, delay:i*35, easing:'cubic-bezier(.3,.55,.25,1)', fill:'forwards' });
    });
    setTimeout(() => {
      buildFan(true);
      subline.textContent = '순서만 바뀔 뿐, 운명의 카드는 그대로입니다.';
      setTimeout(() => { shuffling = false; btnSub.style.pointerEvents = ''; }, 700);
    }, 600);
  } else if (state === 'confirm') {
    revertToPick();
  }
};

btnMain.onclick = () => {
  if (state === 'confirm') {
    state = 'revealing';
    showBtns(null, null);

    const cardId = deck.pop();
    const card = CARDS[cardId];
    picks.push(cardId);

    chosenEl.querySelector('.face.front').innerHTML = `
      <img class="front-img" src="${CARD_FILES[cardId]}" alt="${card.name}">
      <span class="front-label">${card.name}</span>`;

    chosenEl.classList.add('flipped');
    document.body.classList.add('warm');

    setTimeout(() => {
      // ① 다른 카드들 먼저 조용히 사라짐
      stage.querySelectorAll('.fan-card').forEach(c => { if (c !== chosenEl) c.classList.add('gone'); });
      document.getElementById('dot-' + step).classList.add('done');

      // ② 잠시 숨 고른 뒤, 카드와 무대가 한 호흡으로 함께 이동
      setTimeout(() => {
        chosenEl.classList.remove('chosen');
        chosenEl.classList.add('risen');
        stage.classList.add('compact');
      }, 350);

      // ③ 이동이 끝난 뒤에야 텍스트와 풀이 등장
      setTimeout(() => {
        setText(card.name, card.keyword);
        document.getElementById('interp-badge').textContent = TIME_KO[step];
        document.getElementById('interp-name').textContent = `${card.emoji} ${card.name}`;
        document.getElementById('interp-text').textContent = INTERP[fortune][cardId][TIME_KEYS[step]];
        interp.style.display = 'block';
        requestAnimationFrame(() => interp.classList.add('visible'));
        state = 'interp';
      }, 1200);

      setTimeout(() => {
        showBtns(step < 2 ? `${TIME_KO[step+1]} 카드 뽑기` : '종합 메시지 보기', null);
      }, 1500);
    }, 1250);

  } else if (state === 'interp') {
    if (step < 2) {
      step++;
      state = 'pick';
      // ① 풀이·이전 카드 먼저 사라짐
      document.body.classList.remove('warm');
      interp.classList.remove('visible');
      if (chosenEl) chosenEl.classList.add('gone');
      showBtns(null, null);
      setTimeout(() => { interp.style.display = 'none'; }, 400);
      document.getElementById('step-label').textContent = FORTUNE_NAMES[fortune] + ' · ' + TIME_TAGS[step];
      setText('마음이 끌리는 카드를<br>골라 보세요', '아무 카드나 좋습니다. 첫 느낌을 믿으세요.');
      // ② 무대가 한 호흡으로 펼쳐지고
      setTimeout(() => { stage.classList.remove('compact'); }, 350);
      // ③ 확장이 끝난 뒤에야 새 카드 입장
      setTimeout(() => {
        chosenEl = null;
        buildFan();
        showBtns(null, '다시 섞기');
      }, 1150);
    } else {
      state = 'overall';
      interp.classList.remove('visible');
      document.getElementById('step-label').textContent = FORTUNE_NAMES[fortune] + ' · 종합 메시지';
      stage.classList.add('hidden-stage');
      setTimeout(() => {
        const row = document.getElementById('final-row');
        row.innerHTML = picks.map((id, i) => `
          <div class="mini-card">
            <span class="mini-time">${TIME_KO[i]}</span>
            <img class="mini-img" src="${CARD_FILES[id]}" alt="${CARDS[id].name}">
            <span class="mini-name">${CARDS[id].name}</span>
          </div>`).join('');
        row.classList.add('visible');
        setText('세 장의 카드가<br>하나의 이야기를 만듭니다', '');
        const msgs = OVERALL[fortune];
        document.getElementById('interp-badge').textContent = '종합';
        document.getElementById('interp-name').textContent = '🌟 운명의 메시지';
        document.getElementById('interp-text').textContent = msgs[Math.floor(Math.random()*msgs.length)];
        interp.style.display = 'block';
        setTimeout(() => interp.classList.add('visible'), 300);

        const dl = document.getElementById('detail-list');
        dl.innerHTML = picks.map((id, i) => `
          <div class="detail-item">
            <div class="detail-head">
              <span class="detail-badge">${TIME_KO[i]}</span>
              <span class="detail-name">${CARDS[id].emoji} ${CARDS[id].name}</span>
            </div>
            <p class="detail-text">${INTERP[fortune][id][TIME_KEYS[i]]}</p>
          </div>`).join('');
        document.getElementById('detail-toggle').classList.add('visible');

        showBtns('🔮 다시 점치기', null);
      }, 450);
    }
  } else if (state === 'overall') {
    location.reload();
  }
};

/* ═══ PWA: 홈 화면에 추가 ═══ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const installBtn = document.getElementById('install-btn');
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add('show');
});

const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
const inStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIos && !inStandalone) installBtn.classList.add('show');

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') installBtn.classList.remove('show');
    deferredPrompt = null;
  } else if (isIos) {
    document.getElementById('ios-guide').classList.toggle('show');
  }
});

window.addEventListener('appinstalled', () => {
  installBtn.classList.remove('show');
  document.getElementById('ios-guide').classList.remove('show');
});

document.getElementById('detail-toggle').onclick = function() {
  const dl = document.getElementById('detail-list');
  const open = dl.classList.toggle('open');
  this.textContent = open ? '상세 풀이 접기 ▴' : '세 카드의 상세 풀이 보기 ▾';
};
</script>
